<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Budget Ease</title>
  <meta name="description" content="Download Budget Ease — simple pocket budgeting for iPhone and Android." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#0e1210" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Budget Ease" />
  <meta property="og:title" content="Get Budget Ease" />
  <meta property="og:description" content="Simple pocket budgeting for iPhone and Android. Offline, no account, free." />
  <meta property="og:url" content="https://pocketsprout.github.io/budget-ease/get/" />
  <meta property="og:image" content="https://pocketsprout.github.io/budget-ease/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <script>
    // Single link for ads: send each visitor straight to the right store.
    // Runs before the page paints, so phone users never see this page.
    (function () {
      var APP_STORE = 'https://apps.apple.com/app/id6774810242';
      var PLAY_ID = 'com.pocketsprout.budgetease.beta';

      var ua = navigator.userAgent || '';
      // iPadOS 13+ reports itself as a Mac; touch support gives it away.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);

      // Forward utm_* params to Google Play as the install referrer,
      // so Play Console can attribute installs to the ad campaign.
      var play = 'https://play.google.com/store/apps/details?id=' + PLAY_ID;
      try {
        var params = new URLSearchParams(location.search);
        var utm = new URLSearchParams();
        params.forEach(function (value, key) {
          if (key.indexOf('utm_') === 0) utm.append(key, value);
        });
        if (utm.toString()) play += '&referrer=' + encodeURIComponent(utm.toString());
      } catch (e) { /* old browser: plain Play link is fine */ }

      window.STORE_LINKS = { ios: APP_STORE, android: play };

      if (isIOS) location.replace(APP_STORE);
      else if (isAndroid) location.replace(play);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #4caf82;
      --green-light: #6fcfa0;
      --green-dim: #2d7a58;
      --bg: #0e1210;
      --bg-card: #161c18;
      --border: rgba(76, 175, 130, 0.15);
      --text: #e8f0eb;
      --text-muted: #7a9485;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      line-height: 1.6;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 1.5rem;
    }

    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin-bottom: 1rem;
    }

    .brand {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 2.4rem;
      line-height: 1.1;
      color: var(--green-light);
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .store-badge {
      display: inline-block;
      line-height: 0;
      border-radius: 10px;
      transition: transform 0.2s, opacity 0.2s;
    }
    .store-badge img { height: 56px; width: auto; display: block; }
    .store-badge:hover { transform: translateY(-1px); opacity: 0.9; }
    .store-badge:focus-visible { outline: 2px solid var(--green-light); outline-offset: 3px; }

    /* QR code: only useful on a computer, so it's hidden on phones. */
    .qr {
      margin-top: 2rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--border);
    }

    .qr img {
      width: 148px;
      height: 148px;
      border-radius: 12px;
      display: block;
      margin: 0 auto 0.75rem;
    }

    .qr span { font-size: 0.85rem; color: var(--text-muted); }

    @media (hover: none) and (pointer: coarse) {
      .qr { display: none; }
    }

    .more {
      display: inline-block;
      margin-top: 1.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .more:hover { color: var(--green-light); }
  </style>
</head>
<body>
  <main class="card">
    <img class="app-icon" src="../assets/icon-192.png" alt="" width="72" height="72" />
    <div class="brand" data-i18n="brand">by Pocket Sprout</div>
    <h1>Budget Ease</h1>
    <p data-i18n="tagline">Simple pocket budgeting. Offline, no account, free.</p>
    <div class="buttons">
      <a id="ios" class="store-badge" href="https://apps.apple.com/app/id6774810242"><img src="../assets/app-store-badge.svg" alt="Download on the App Store" data-i18n-alt="altIos" width="168" height="56" /></a>
      <a id="android" class="store-badge" href="https://play.google.com/store/apps/details?id=com.pocketsprout.budgetease.beta"><img id="play-badge" src="../assets/google-play-badge.png" alt="Get it on Google Play" data-i18n-alt="altAndroid" width="188" height="56" /></a>
    </div>
    <div class="qr">
      <img src="../assets/qr-get.svg" alt="QR code linking to this page" data-i18n-alt="altQr" width="148" height="148" />
      <span data-i18n="qr">On your computer? Scan with your phone's camera.</span>
    </div>
    <a id="more" class="more" href="../" data-i18n="more">Learn more about Budget Ease</a>
  </main>

  <script>
    // Keep the utm referrer on the visible Play button too.
    if (window.STORE_LINKS) {
      document.getElementById('android').href = window.STORE_LINKS.android;
    }

    // Spanish for Spanish-language browsers (or ?lang=es), English otherwise.
    (function () {
      var forced = new URLSearchParams(location.search).get('lang');
      var lang = forced || (navigator.language || 'en');
      if (lang.toLowerCase().indexOf('es') !== 0) return;

      var es = {
        brand: 'por Pocket Sprout',
        tagline: 'Presupuesto por bolsillos, fácil. Sin internet, sin cuenta y gratis.',
        qr: '¿No estás en el celular? Escanea el código con la cámara.',
        more: 'Conoce más sobre Budget Ease',
        altIos: 'Descárgalo en el App Store',
        altAndroid: 'Disponible en Google Play',
        altQr: 'Código QR que lleva a esta página'
      };
      document.documentElement.lang = 'es';
      document.title = 'Descarga Budget Ease';
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        el.textContent = es[el.getAttribute('data-i18n')];
      });
      document.querySelectorAll('[data-i18n-alt]').forEach(function (el) {
        el.alt = es[el.getAttribute('data-i18n-alt')];
      });
      var playBadge = document.getElementById('play-badge');
      playBadge.src = '../assets/google-play-badge-es.png';
      playBadge.width = 188;
      document.getElementById('more').href = '../es/';
    })();
  </script>
</body>
</html>
